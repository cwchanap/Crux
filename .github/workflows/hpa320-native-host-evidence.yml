name: HPA-320 Native Host Evidence

on:
  push:
    branches:
      - hpa-320-native-seal-evidence

permissions:
  actions: read
  contents: read

jobs:
  observe-native-host:
    name: observe-native-host
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      observation: ${{ steps.observe.outputs.observation }}

    steps:
      - name: Check out evidence validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Assert native host and write observation
        id: observe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          from tools.hpa320.github_host_evidence import collect_host_numeric_fingerprint


          def required_environment(name: str) -> str:
              value = os.environ.get(name)
              if not value:
                  raise SystemExit(f"{name} is missing")
              return value


          def docker_info(field: str) -> str:
              result = subprocess.run(
                  ["docker", "info", "--format", f"{{{{.{field}}}}}"],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              value = result.stdout.strip()
              if not value:
                  raise SystemExit(f"Docker {field} is missing")
              return value


          runner_os = required_environment("RUNNER_OS")
          runner_arch = required_environment("RUNNER_ARCH")
          uname_architecture = subprocess.run(
              ["uname", "-m"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          docker_os_type = docker_info("OSType")
          docker_architecture = docker_info("Architecture")
          docker_server_version = docker_info("ServerVersion")

          if runner_os != "Linux":
              raise SystemExit(f"unexpected RUNNER_OS: {runner_os}")
          if runner_arch != "X64":
              raise SystemExit(f"unexpected RUNNER_ARCH: {runner_arch}")
          if uname_architecture != "x86_64":
              raise SystemExit(f"unexpected uname architecture: {uname_architecture}")
          if docker_os_type != "linux":
              raise SystemExit(f"unexpected Docker OSType: {docker_os_type}")
          if docker_architecture not in {"x86_64", "amd64"}:
              raise SystemExit(f"unexpected Docker architecture: {docker_architecture}")

          github_sha = required_environment("GITHUB_SHA")
          github_run_id = required_environment("GITHUB_RUN_ID")
          github_run_attempt = required_environment("GITHUB_RUN_ATTEMPT")
          github_repository = required_environment("GITHUB_REPOSITORY")
          github_workflow_ref = required_environment("GITHUB_WORKFLOW_REF")
          github_server_url = required_environment("GITHUB_SERVER_URL").rstrip("/")

          if not re.fullmatch(r"[0-9a-f]{40}", github_sha):
              raise SystemExit("GITHUB_SHA is not a full lowercase Git object ID")
          if not github_run_id.isdecimal() or int(github_run_id) < 1:
              raise SystemExit("GITHUB_RUN_ID is not a positive integer")
          if not github_run_attempt.isdecimal() or int(github_run_attempt) < 1:
              raise SystemExit("GITHUB_RUN_ATTEMPT is not a positive integer")

          observation = {
              "docker_architecture": docker_architecture,
              "docker_os_type": docker_os_type,
              "docker_server_version": docker_server_version,
              "github_repository": github_repository,
              "github_run_attempt": int(github_run_attempt),
              "github_run_id": int(github_run_id),
              "github_run_url": (
                  f"{github_server_url}/{github_repository}/actions/runs/{github_run_id}"
              ),
              "github_sha": github_sha,
              "github_workflow_ref": github_workflow_ref,
              "host_numeric_fingerprint": collect_host_numeric_fingerprint().as_json(),
              "runner_arch": runner_arch,
              "runner_os": runner_os,
              "uname_architecture": uname_architecture,
          }
          content = json.dumps(
              observation,
              allow_nan=False,
              ensure_ascii=False,
              separators=(",", ":"),
              sort_keys=True,
          ).encode() + b"\n"
          Path("native-host-observation.json").write_bytes(content)
          with Path(required_environment("GITHUB_OUTPUT")).open("a", encoding="utf-8") as output:
              output.write(f"observation={content.decode().strip()}\n")
          PY

  native-host-evidence:
    name: native-host-evidence
    needs: observe-native-host
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out evidence validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Derive and validate completed job evidence
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_HOST_OBSERVATION: ${{ needs.observe-native-host.outputs.observation }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          from src.benchmark.backend_attestation import parse_host_numeric_fingerprint
          from src.benchmark.backend_identity import canonical_json_bytes, strict_json_loads
          from tools.hpa320.github_host_evidence import build_github_hosted_evidence


          def required_environment(name: str) -> str:
              value = os.environ.get(name)
              if not value:
                  raise SystemExit(f"{name} is missing")
              return value


          token = required_environment("GH_TOKEN")
          repository = required_environment("GITHUB_REPOSITORY")
          run_id = required_environment("GITHUB_RUN_ID")
          api_headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          jobs_request = urllib.request.Request(
              (
                  f"https://api.github.com/repos/{repository}/actions/runs/"
                  f"{run_id}/jobs?filter=latest&per_page=100"
              ),
              headers=api_headers,
          )
          with urllib.request.urlopen(jobs_request, timeout=30) as response:
              jobs_record = json.loads(response.read())
          matches = [
              job
              for job in jobs_record.get("jobs", [])
              if job.get("name") == "observe-native-host"
          ]
          if len(matches) != 1:
              raise SystemExit("completed observation job is not unique")
          observed_job_id = matches[0].get("id")
          if (
              not isinstance(observed_job_id, int)
              or isinstance(observed_job_id, bool)
              or observed_job_id < 1
          ):
              raise SystemExit("completed observation job ID is invalid")

          api_request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/jobs/{observed_job_id}",
              headers=api_headers,
          )
          with urllib.request.urlopen(api_request, timeout=30) as response:
              api_record_bytes = response.read()
          api_record = json.loads(api_record_bytes)
          expected = {
              "conclusion": "success",
              "head_sha": required_environment("GITHUB_SHA"),
              "id": observed_job_id,
              "name": "observe-native-host",
              "run_id": int(run_id),
              "status": "completed",
          }
          for field, value in expected.items():
              if api_record.get(field) != value:
                  raise SystemExit(f"unexpected completed observation job {field}")
          if api_record.get("labels") != ["ubuntu-24.04"]:
              raise SystemExit("unexpected completed observation job labels")

          observation_content = required_environment("NATIVE_HOST_OBSERVATION").encode()
          observation = strict_json_loads(observation_content, require_canonical=True)
          if not isinstance(observation, dict):
              raise SystemExit("native host observation must be an object")
          expected_observation = {
              "github_repository": repository,
              "github_run_id": int(run_id),
              "github_sha": required_environment("GITHUB_SHA"),
              "runner_arch": "X64",
              "runner_os": "Linux",
              "uname_architecture": "x86_64",
          }
          for field, value in expected_observation.items():
              if observation.get(field) != value:
                  raise SystemExit(f"unexpected native host observation {field}")
          run_url = api_record.get("html_url")
          if (
              not isinstance(run_url, str)
              or not run_url.startswith(f"{observation['github_run_url']}/job/")
          ):
              raise SystemExit("completed observation job URL is invalid")

          fingerprint = parse_host_numeric_fingerprint(
              observation.get("host_numeric_fingerprint")
          )
          evidence = build_github_hosted_evidence(
              api_record_bytes=api_record_bytes,
              host_numeric_fingerprint=fingerprint,
              job_id=observed_job_id,
              run_url=run_url,
              workflow_commit=observation["github_sha"],
          )
          Path("github-job-api-record.json").write_bytes(api_record_bytes)
          Path("native-host-observation.json").write_bytes(observation_content + b"\n")
          Path("native-host-evidence.json").write_bytes(
              canonical_json_bytes(evidence) + b"\n"
          )
          PY
          python3 -m tools.hpa320.seal_oaf_backend \
            validate-host \
            --evidence native-host-evidence.json

      - name: Upload native host evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hpa320-native-host-observation
          path: |
            github-job-api-record.json
            native-host-evidence.json
            native-host-observation.json
          if-no-files-found: error
          retention-days: 7
