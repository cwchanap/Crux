name: HPA-320 Native Bootstrap

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact lowercase 40-character diagnostic commit to execute
        required: true
        type: string

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  native-bootstrap:
    name: native-bootstrap-diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMMIT_SHA: ${{ inputs.commit_sha }}

    steps:
      - name: Check out exact diagnostic commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}

      - name: Install exact UV
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.8"
          python-version: "3.12"
          enable-cache: false

      - name: Diagnose the current native host
        env:
          RUNNER_ENVIRONMENT_CONTEXT: ${{ runner.environment }}
          RUNNER_OS_CONTEXT: ${{ runner.os }}
          RUNNER_ARCH_CONTEXT: ${{ runner.arch }}
          WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
        run: >-
          uv run python -m tools.hpa320.oaf_host_attestation_diagnostic
          --phase bootstrap
          --output "$RUNNER_TEMP/hpa423-bootstrap-host-attestation"
