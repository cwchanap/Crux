name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.12.9" pylint

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Pylint (errors-only)
        run: |
          pylint --errors-only --disable=E1120,E0401 src

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi \
            pytest \
            pytest-asyncio \
            pytest-cov \
            pyyaml \
            aiofiles \
            httpx \
            python-multipart \
            click \
            requests \
            numpy \
            soundfile \
            librosa \
            pretty-midi \
            "boto3>=1.42,<2"
          pip install --no-deps -e .

      - name: Run tests with coverage
        env:
          PRELOAD_MODEL: "0"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          python -m pytest -q --cov=src --cov-report=xml:coverage.xml --cov-report=term-missing > pytest.log 2>&1
          status=$?
          set -e
          tail -n 160 pytest.log
          exit "$status"

      - name: Upload pytest failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  repair-freeze-authorities:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate linked freeze authorities
        run: |
          set -euo pipefail
          python -m tools.hpa320.generate_runner_source_manifest --repository-root .
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          runner_path = root / "runtime/oaf_tf1/runner-source-manifest.json"
          build_path = root / "runtime/oaf_tf1/build-context-manifest.json"
          request_path = (
              root
              / "config/benchmark/backends/"
              "magenta-egmd-tf1-94529798-8hit-v1.calibration-bootstrap-request.json"
          )

          def canonical(value: object) -> bytes:
              return (
                  json.dumps(
                      value,
                      ensure_ascii=False,
                      separators=(",", ":"),
                      sort_keys=True,
                  ).encode("utf-8")
                  + b"\n"
              )

          build = json.loads(build_path.read_text(encoding="utf-8"))
          rows = {row["path"]: row for row in build["files"]}
          for relative in (
              "runtime/oaf_tf1/runner-source-manifest.json",
              "tools/hpa320/seal_oaf_backend.py",
          ):
              content = (root / relative).read_bytes()
              row = rows[relative]
              row["byte_length"] = len(content)
              row["sha256"] = hashlib.sha256(content).hexdigest()
          build_path.write_bytes(canonical(build))

          request = json.loads(request_path.read_text(encoding="utf-8"))
          request["runner_source_manifest_sha256"] = hashlib.sha256(
              runner_path.read_bytes()
          ).hexdigest()
          request["build_context_manifest_sha256"] = hashlib.sha256(
              build_path.read_bytes()
          ).hexdigest()
          request_path.write_bytes(canonical(request))
          PY

      - name: Verify regenerated authority links
        run: |
          set -euo pipefail
          python -m tools.hpa320.generate_runner_source_manifest \
            --repository-root . \
            --check
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          runner = root / "runtime/oaf_tf1/runner-source-manifest.json"
          build = root / "runtime/oaf_tf1/build-context-manifest.json"
          request_path = (
              root
              / "config/benchmark/backends/"
              "magenta-egmd-tf1-94529798-8hit-v1.calibration-bootstrap-request.json"
          )
          manifest = json.loads(build.read_text(encoding="utf-8"))
          rows = {row["path"]: row for row in manifest["files"]}
          for relative in (
              "runtime/oaf_tf1/runner-source-manifest.json",
              "tools/hpa320/seal_oaf_backend.py",
          ):
              content = (root / relative).read_bytes()
              assert rows[relative] == {
                  "byte_length": len(content),
                  "path": relative,
                  "sha256": hashlib.sha256(content).hexdigest(),
              }
          request = json.loads(request_path.read_text(encoding="utf-8"))
          assert request["runner_source_manifest_sha256"] == hashlib.sha256(
              runner.read_bytes()
          ).hexdigest()
          assert request["build_context_manifest_sha256"] == hashlib.sha256(
              build.read_bytes()
          ).hexdigest()
          PY

      - name: Commit regenerated authorities
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            runtime/oaf_tf1/runner-source-manifest.json \
            runtime/oaf_tf1/build-context-manifest.json \
            config/benchmark/backends/magenta-egmd-tf1-94529798-8hit-v1.calibration-bootstrap-request.json
          git commit -m "chore: refresh OaF freeze authorities"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
