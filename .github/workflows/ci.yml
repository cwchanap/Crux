name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  repair-inode-regression:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Make inode mismatch deterministic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/benchmark/test_backend_prepare.py")
          text = path.read_text(encoding="utf-8")
          old = "        mismatched_identity = (tmp_path.stat().st_dev, tmp_path.stat().st_ino + 1)\n"
          new = "        mismatched_identity = (staging.stat().st_dev, staging.stat().st_ino + 100)\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one faulty inode identity, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/benchmark/test_backend_prepare.py
          git commit -m "test: make inode mismatch deterministic"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.12.9" pylint

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Pylint (errors-only)
        run: |
          pylint --errors-only --disable=E1120,E0401 src

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi \
            pytest \
            pytest-asyncio \
            pytest-cov \
            pyyaml \
            aiofiles \
            httpx \
            python-multipart \
            click \
            requests \
            numpy \
            soundfile \
            librosa \
            pretty-midi \
            "boto3>=1.42,<2"
          pip install --no-deps -e .

      - name: Run tests with coverage
        env:
          PRELOAD_MODEL: "0"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          python -m pytest -q --cov=src --cov-report=xml:coverage.xml --cov-report=term-missing > pytest.log 2>&1
          status=$?
          set -e
          tail -n 160 pytest.log
          exit "$status"

      - name: Upload pytest failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
