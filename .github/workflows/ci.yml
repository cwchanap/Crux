name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  lint:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.12.9" pylint

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Pylint (errors-only)
        run: |
          pylint --errors-only --disable=E1120,E0401 src

  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi \
            pytest \
            pytest-asyncio \
            pytest-cov \
            pyyaml \
            aiofiles \
            httpx \
            python-multipart \
            click \
            requests \
            numpy \
            soundfile \
            librosa \
            pretty-midi \
            "boto3>=1.42,<2"
          pip install --no-deps -e .

      - name: Run tests with coverage
        env:
          PRELOAD_MODEL: "0"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          python -m pytest -q --cov=src --cov-report=xml:coverage.xml --cov-report=term-missing > pytest.log 2>&1
          status=$?
          set -e
          tail -n 160 pytest.log
          exit "$status"

      - name: Upload pytest failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
