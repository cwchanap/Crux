name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pylint

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Pylint (errors-only)
        run: |
          pylint --errors-only --disable=E1120,E0401 src

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi \
            pytest \
            pytest-asyncio \
            pytest-cov \
            aiofiles \
            httpx \
            python-multipart \
            click \
            requests \
            numpy \
            soundfile \
            librosa \
            pretty-midi

      - name: Run tests with coverage
        env:
          PRELOAD_MODEL: "0"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q --cov=src --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
