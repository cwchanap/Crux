name: OaF smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Prepare OaF checkpoint
        run: uv run crux benchmark prepare-backend --backend oaf --download

      - name: Build OaF image
        run: docker build -f runtime/oaf_tf1/Dockerfile -t crux-oaf-tf1:local .

      - name: Run OaF smoke
        shell: bash
        run: |
          set -euo pipefail
          summary="$(uv run crux benchmark smoke-backend --backend oaf)"
          printf '%s\n' "$summary" | tee smoke-summary.json
          {
            echo "## OaF smoke"
            echo
            echo "commit: ${GITHUB_SHA}"
            echo "ref: ${GITHUB_REF}"
            echo
            echo '```json'
            cat smoke-summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload prediction artifact
        uses: actions/upload-artifact@v4
        with:
          name: oaf-smoke-prediction
          path: artifacts/benchmark/oaf-smoke/prediction.jsonl
          if-no-files-found: error
