name: One-shot inode test repair

on:
  push:
    branches:
      - codex/hpa-481-work-job-attestation-design

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/hpa-481-work-job-attestation-design
          fetch-depth: 1

      - name: Make inode mismatch deterministic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/benchmark/test_backend_prepare.py")
          text = path.read_text(encoding="utf-8")
          old = "        mismatched_identity = (tmp_path.stat().st_dev, tmp_path.stat().st_ino + 1)\n"
          new = "        mismatched_identity = (staging.stat().st_dev, staging.stat().st_ino + 100)\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one faulty inode identity, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi \
            pytest \
            pytest-asyncio \
            aiofiles \
            httpx \
            python-multipart \
            click \
            requests \
            numpy \
            soundfile \
            librosa \
            pretty-midi \
            pyyaml \
            "boto3>=1.42,<2"
          pip install --no-deps -e .

      - name: Verify corrected regression
        env:
          PRELOAD_MODEL: "0"
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/benchmark/test_backend_prepare.py::test_rollback_owned_directory_returns_false_on_inode_mismatch

      - name: Commit branch repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/benchmark/test_backend_prepare.py
          git commit -m "test: make inode mismatch deterministic"
          git push origin HEAD:codex/hpa-481-work-job-attestation-design
